<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Недра Экки • Живое Сердце</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a1f 0%, #1a0f2e 100%);
      color: #e0d4ff;
    }
    .magic-glow {
      text-shadow: 0 0 20px #c4a1ff, 0 0 40px #a78bfa;
    }
    .section-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgb(167 139 250);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Hero -->
  <header class="relative h-screen flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(at_center,#4c1d95_0%,transparent_70%)"></div>
    
    <div class="relative z-10 text-center px-6">
      <h1 class="text-7xl md:text-8xl font-bold magic-glow mb-4 tracking-widest">НЕДРА ЭККИ</h1>
      <p class="text-2xl md:text-3xl text-purple-300">Фрактальное живое поселение • Сердце Экки</p>
      <div class="mt-12">
        <a href="#plan" class="inline-block bg-gradient-to-r from-purple-500 to-pink-500 hover:from-pink-500 hover:to-purple-500 text-white font-medium px-10 py-5 rounded-full text-xl transition-all duration-300">
          Погрузиться в план →
        </a>
      </div>
    </div>

    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
      <i class="fas fa-chevron-down text-4xl"></i>
    </div>
  </header>

  <!-- Общий план -->
  <section id="plan" class="py-20 px-6 max-w-7xl mx-auto">
    <h2 class="text-5xl font-bold text-center mb-12 magic-glow">Общий план сверху</h2>
    <div class="rounded-3xl overflow-hidden shadow-2xl border border-purple-500/30">
      <img src="https://files.catbox.moe/8v4p2k.jpg" alt="Общий план Недра Экки" class="w-full">
    </div>
    <p class="text-center mt-6 text-purple-300 text-lg">Фрактальный цветок из 6 лепестков вокруг Храма-Спирали</p>
  </section>

  <footer class="text-center py-12 text-purple-400">
    <p class="text-xl">Недра Экки • Живое • Фрактальное • Волшебное</p>
    <p class="mt-4">Создано с любовью и любопытством ✨</p>
  </footer>

</body>
</html>
