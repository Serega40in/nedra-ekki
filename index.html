<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Недра Экки • Живое Фрактальное Сердце</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0a051f 0%, #1a0f35 100%); }
    .glow { text-shadow: 0 0 30px #c4a1ff, 0 0 60px #a78bfa; }
    .nav-link { transition: all 0.3s; }
    .nav-link:hover { color: #e0bbff; transform: translateY(-2px); }
    .mobile-menu {
      transform: translateY(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mobile-menu.open {
      transform: translateY(0);
    }
  </style>
</head>
<body class="text-purple-100 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-lg z-50 border-b border-purple-500/30">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-3xl font-bold glow">Недра Экки</h1>
      
      <!-- Desktop Menu -->
      <div class="hidden md:flex gap-8 text-lg">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="temple.html" class="nav-link">Храм</a>
        <a href="petals.html" class="nav-link">Лепестки</a>
        <a href="map.html" class="nav-link">Карта</a>
        <a href="manifest.html" class="nav-link">Манифест</a>
        <a href="rituals.html" class="nav-link">Ритуалы</a>
        <a href="gallery.html" class="nav-link">Галерея</a>
      </div>

      <!-- Hamburger -->
      <button id="hamburger" class="md:hidden text-3xl">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu fixed inset-0 bg-black/95 pt-20 hidden md:hidden flex-col">
      <div class="flex flex-col text-2xl gap-8 px-10">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="temple.html" class="nav-link">Храм</a>
        <a href="petals.html" class="nav-link">Лепестки</a>
        <a href="map.html" class="nav-link">Карта</a>
        <a href="manifest.html" class="nav-link">Манифест</a>
        <a href="rituals.html" class="nav-link">Ритуалы</a>
        <a href="gallery.html" class="nav-link">Галерея</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,#6b21a8_0%,transparent_60%)] opacity-40"></div>
    <div class="relative z-10 text-center px-6">
      <h1 class="text-6xl md:text-8xl font-bold glow mb-6">НЕДРА ЭККИ</h1>
      <p class="text-2xl md:text-3xl text-purple-300 max-w-2xl mx-auto">Фрактальное живое поселение • Гармония магии, природы и сознания</p>
    </div>
  </header>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('open');
      hamburger.innerHTML = mobileMenu.classList.contains('open') 
        ? '<i class="fas fa-times"></i>' 
        : '<i class="fas fa-bars"></i>';
    });
  </script>
</body>
</html>
